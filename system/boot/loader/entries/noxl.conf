# NoxL installed-system boot entry (systemd-boot / UEFI).
# Installed to the ESP as loader/entries/noxl.conf.
# The installer fills in the actual root UUID at install time.

title   NoxL (OBSIDIAN)
linux   /vmlinuz-linux
initrd  /initramfs-linux.img
options root=UUID=__ROOT_UUID__ rw quiet splash

title   NoxL (fallback initramfs)
linux   /vmlinuz-linux
initrd  /initramfs-linux-fallback.img
options root=UUID=__ROOT_UUID__ rw quiet splash

title   NoxL LTS (OBSIDIAN)
linux   /vmlinuz-linux-lts
initrd  /initramfs-linux-lts.img
options root=UUID=__ROOT_UUID__ rw quiet splash