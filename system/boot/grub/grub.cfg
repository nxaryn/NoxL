# NoxL GRUB configuration (BIOS and UEFI fallback).
# Installed to /boot/grub/grub.cfg on the installed system.
# The installer substitutes __ROOT_UUID__ with the actual root device UUID.

set timeout=5
set default=0

# Load the OBSIDIAN theme if present.
if [ -f /boot/grub/themes/obsidian/theme.txt ]; then
  set theme=/boot/grub/themes/obsidian/theme.txt
fi

menuentry "NoxL (OBSIDIAN)" --class noxl --class gnu-linux {
    search --no-floppy --fs-uuid --set=root __ROOT_UUID__
    linux /vmlinuz-linux root=UUID=__ROOT_UUID__ rw quiet splash
    initrd /initramfs-linux.img
}

menuentry "NoxL (fallback initramfs)" --class noxl {
    search --no-floppy --fs-uuid --set=root __ROOT_UUID__
    linux /vmlinuz-linux root=UUID=__ROOT_UUID__ rw quiet splash
    initrd /initramfs-linux-fallback.img
}

menuentry "NoxL LTS (OBSIDIAN)" --class noxl {
    search --no-floppy --fs-uuid --set=root __ROOT_UUID__
    linux /vmlinuz-linux-lts root=UUID=__ROOT_UUID__ rw quiet splash
    initrd /initramfs-linux-lts.img
}

menuentry "Reboot" {
    reboot
}

menuentry "Power Off" {
    halt
}