# NoxL mkinitcpio configuration (installed system).
# Mirrors the Arch defaults with the OBSIDIAN hooks NoxL needs.
# MODULES: add early modules here if a specific storage/controller is required.
MODULES=()

# BINARIES: extra binaries to include in the initramfs.
BINARIES=()

# FILES: extra files to include.
FILES=()

# HOOKS: base udev + keyboard + keymap + consolefont + encrypt (LVM optional)
#        + filesystems. `encrypt` enables LUKS passphrase unlock at boot.
#        `lvm2` is included so LVM-on-LUKS installs work.
HOOKS=(base udev autodetect modconf block filesystems keyboard fsck)

# COMPRESSION: zstd is fast and well-supported by the kernel.
COMPRESSION="zstd"
COMPRESSION_OPTIONS=(-T0)