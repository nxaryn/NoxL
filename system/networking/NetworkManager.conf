# NoxL NetworkManager configuration.
# Installed to /etc/NetworkManager/conf.d/noxl.conf on the installed system.
# Uses NetworkManager as the single source of truth for networking.

[main]
plugins=keyfile
rc-manager=resolvconf

[device]
wifi.scan-rand-mac-address=yes

[connection]
wifi.save-config=true

[connectivity]
uri=http://connectivity-check.example.com/generate_204
interval=300