#!/usr/bin/env bash
#
# NoxL UEFI boot entry (systemd-boot).
# Installed to the ISO's EFI system partition as
# loader/entries/noxl-live.conf and selected by loader/loader.conf.

title   NoxL Live (OBSIDIAN)
linux   /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
initrd  /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
options archisobasedir=%INSTALL_DIR% archisodevice=UUID=%ARCHISO_UUID% rw quiet splash