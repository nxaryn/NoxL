#!/usr/bin/env bash
#
# NoxL archiso pacman configuration.
# Used inside the ISO build chroot. Standard Arch repos + multilib for
# 32-bit compatibility (Wine/Steam later).

[options]
HoldPkg     = pacman glibc
Architecture = auto
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

[options]
Color
CheckSpace
VerbosePkgLists
ILoveCandy