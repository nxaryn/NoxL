# NoxL live boot menu (BIOS / syslinux)
# Real boot entries: the live environment and the installer entry point.

UI vesamenu.c32
PROMPT 0
MENU TITLE NoxL Live (BIOS)
MENU BACKGROUND splash.png
TIMEOUT 300

MENU WIDTH 78
MENU MARGIN 4
MENU ROWS 6
MENU VSHIFT 10
MENU TIMEOUTROW 14
MENU TABMSGROW 14
MENU CMDLINEROW 14
MENU HELPMSGROW 16
MENU HELPMSGENDROW 29
MENU COLOR border        #00000000 #00000000 none
MENU COLOR title         #B44CFF #111116 none
MENU COLOR sel           #B44CFF #181820 none
MENU COLOR unsel         #F2EFF7 #111116 none
MENU COLOR help          #96919F #111116 none
MENU COLOR timeout_msg   #96919F #111116 none
MENU COLOR timeout       #B44CFF #111116 none
MENU COLOR disabled      #96919F #111116 none
MENU COLOR tabmsg        #96919F #111116 none
MENU COLOR cmdmark       #B44CFF #111116 none
MENU COLOR cmdline       #F2EFF7 #111116 none
MENU COLOR scrollbar     #B44CFF #111116 none

LABEL live
  MENU LABEL Boot NoxL Live (OBSIDIAN)
  LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
  INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
  APPEND archisobasedir=%INSTALL_DIR% archisodevice=UUID=%ARCHISO_UUID% rw quiet splash

LABEL live-nomodeset
  MENU LABEL Boot NoxL Live (safe graphics)
  LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
  INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
  APPEND archisobasedir=%INSTALL_DIR% archisodevice=UUID=%ARCHISO_UUID% nomodeset rw

LABEL install
  MENU LABEL Start NoxL Installer
  LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
  INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
  APPEND archisobasedir=%INSTALL_DIR% archisodevice=UUID=%ARCHISO_UUID% noxl.install=1 rw quiet

LABEL reboot
  MENU LABEL Reboot
  COM32 reboot.c32

LABEL poweroff
  MENU LABEL Power Off
  COM32 poweroff.c32

LABEL hdt
  MENU LABEL Hardware Detection Tool
  COM32 hdt.c32
  APPEND modules=hardware

LABEL memtest
  MENU LABEL Memtest86+
  LINUX /memtest/memtest.bin
  APPEND

END