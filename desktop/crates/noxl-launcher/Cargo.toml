[package]
name = "noxl-launcher"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "NoxL application launcher: search, categories, pinned/recent apps, power controls"

[lib]
name = "noxl_launcher"
path = "src/lib.rs"

[[bin]]
name = "noxl-launcher"
path = "src/main.rs"

[dependencies]
noxl-config.workspace = true
noxl-ipc.workspace = true
noxl-render.workspace = true

tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
clap.workspace = true
tokio.workspace = true

# .desktop file parsing
freedesktop-desktop-entry = "0.6"
dirs = "5"

# Wayland client for layer-shell
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }