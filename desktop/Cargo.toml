[workspace]
resolver = "2"
members = [
    "crates/noxl-config",
    "crates/noxl-ipc",
    "crates/noxl-compositor",
    "crates/noxl-panel",
    "crates/noxl-launcher",
    "crates/noxl-notifications",
    "crates/noxl-shell",
    "crates/noxl-settings",
    "crates/noxl-widgets",
    "crates/noxl-render",
    "crates/noxl-lockscreen",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/Noxaryn/NoxL"

[workspace.dependencies]
# Wayland / wlroots stack
smithay = { version = "0.7", default-features = false, features = [
    "desktop",
    "wayland_frontend",
    "renderer_gl",
    "backend_winit",
] }
winit = { version = "0.30", features = ["wayland", "x11", "rwh_06"] }
wayland-server = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "server", "staging"] }
wayland-client = "0.31"
wayland-backend = "0.3"

# Config / serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
directories = "5"

# Async / IPC
tokio = { version = "1", features = ["full"] }
zbus = { version = "4", default-features = false, features = ["tokio"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
anyhow = "1"
thiserror = "1"
clap = { version = "4", features = ["derive", "env"] }

# Internal crates
noxl-config = { path = "crates/noxl-config" }
noxl-ipc = { path = "crates/noxl-ipc" }
noxl-render = { path = "crates/noxl-render" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true