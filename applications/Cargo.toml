[workspace]
resolver = "2"
members = [
    "terminal",
    "files",
    "text",
    "monitor",
    "screenshot",
    "archive",
    "software",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/Noxaryn/NoxL"

[workspace.dependencies]
# Wayland / rendering
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

# Config / IPC
noxl-config = { path = "../desktop/crates/noxl-config" }
noxl-ipc = { path = "../desktop/crates/noxl-ipc" }
noxl-render = { path = "../desktop/crates/noxl-render" }

# Utilities
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"

# Terminal
portable-pty = "0.8"
vte = "0.13"

# System info
sysinfo = "0.30"

# Archive
tar = "0.4"
flate2 = "1"
zip = "0.6"
walkdir = "2"

# Image
image = "0.24"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true